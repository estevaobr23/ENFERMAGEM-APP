<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">RUE — 8 componentes</title>
  <desc id="desc">Rede de Atenção às Urgências. Antes da urgência: Promoção, prevenção e vigilância, Atenção Básica. Chegar rápido: SAMU 192 + Regulação, Força Nacional de Saúde. Estabilizar: Sala de Estabilização, UPA 24 h e serviços 24 h. Continuar o cuidado: Hospitalar, Atenção Domiciliar</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <rect x="54" y="54" width="8" height="116" rx="4" fill="#E11D48"/>
  <text x="88" y="100" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="850" fill="#0F172A">RUE — 8 componentes</text>
  <text x="88" y="142" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#475569">Rede de Atenção às Urgências</text>
  <g font-family="Inter, Arial, sans-serif"><g>
    <rect x="54" y="255" width="252" height="470" rx="24" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
    <rect x="76" y="273" width="69" height="42" rx="21" fill="#16A34A"/><text x="110.5" y="301" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">1–2</text>
    <text x="163" y="309" font-size="28" font-weight="800" fill="#166534">Antes da urgência</text>
    <text x="84" y="359" text-anchor="start" font-size="21" font-weight="500" fill="#334155"><tspan x="84" dy="0">• Promoção, prevenção e vigilância</tspan><tspan x="84" dy="31">• Atenção Básica</tspan></text>
  </g><path d="M 311 490 C 322 490, 322 490, 333 490" fill="none" stroke="#E11D48" stroke-width="4" marker-end="url(#arrow)"/><g>
    <rect x="340" y="255" width="252" height="470" rx="24" fill="#FFF1F2" stroke="#E11D48" stroke-width="3"/>
    <rect x="362" y="273" width="69" height="42" rx="21" fill="#E11D48"/><text x="396.5" y="301" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">3–5</text>
    <text x="449" y="309" font-size="28" font-weight="800" fill="#9F1239">Chegar rápido</text>
    <text x="370" y="359" text-anchor="start" font-size="21" font-weight="500" fill="#334155"><tspan x="370" dy="0">• SAMU 192 + Regulação</tspan><tspan x="370" dy="31">• Força Nacional de Saúde</tspan></text>
  </g><path d="M 597 490 C 608 490, 608 490, 619 490" fill="none" stroke="#E11D48" stroke-width="4" marker-end="url(#arrow)"/><g>
    <rect x="626" y="255" width="252" height="470" rx="24" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
    <rect x="648" y="273" width="69" height="42" rx="21" fill="#D97706"/><text x="682.5" y="301" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">4–6</text>
    <text x="735" y="309" font-size="28" font-weight="800" fill="#92400E">Estabilizar</text>
    <text x="656" y="359" text-anchor="start" font-size="21" font-weight="500" fill="#334155"><tspan x="656" dy="0">• Sala de Estabilização</tspan><tspan x="656" dy="31">• UPA 24 h e serviços 24 h</tspan></text>
  </g><path d="M 883 490 C 894 490, 894 490, 905 490" fill="none" stroke="#E11D48" stroke-width="4" marker-end="url(#arrow)"/><g>
    <rect x="912" y="255" width="252" height="470" rx="24" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
    <rect x="934" y="273" width="69" height="42" rx="21" fill="#2563EB"/><text x="968.5" y="301" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">7–8</text>
    <text x="1021" y="309" font-size="28" font-weight="800" fill="#1E3A8A">Continuar o cuidado</text>
    <text x="942" y="359" text-anchor="start" font-size="21" font-weight="500" fill="#334155"><tspan x="942" dy="0">• Hospitalar</tspan><tspan x="942" dy="31">• Atenção Domiciliar</tspan></text>
  </g></g>
  <rect x="70" y="816" width="1060" height="56" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><text x="600" y="851" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#475569">A disposição é didática; não representa ordem clínica obrigatória.</text>

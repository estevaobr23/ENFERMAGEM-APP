<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Diretrizes da RUE</title>
  <desc id="desc">Portaria 1.600/2011 · art. 2º. Porta de entrada: Acolhimento, Classificação de risco. Para todos: Universalidade, Equidade, Integralidade. Em rede: Regionalização, Acesso regulado, Serviços integrados. Jeito de cuidar: Humanização, Equipe multiprofissional, Linhas de cuidado</desc>

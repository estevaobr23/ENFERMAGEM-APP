<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Prescrição problemática</title>
  <desc id="desc">Fluxo de revisão do art. 46. Sem assinatura/registro: Recusar a execução, Exceção: urgência/emergência. Erro ou ilegível: Esclarecer com o prescritor, Registrar no prontuário. Regular: Seguir normas, Realizar checagens de segurança</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <rect x="54" y="54" width="8" height="116" rx="4" fill="#475569"/>
  <text x="88" y="100" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="850" fill="#0F172A">Prescrição problemática</text>
  <text x="88" y="142" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#475569">Fluxo de revisão do art. 46</text>
  <g font-family="Inter, Arial, sans-serif"><g>
    <rect x="58" y="255" width="338" height="470" rx="24" fill="#FFF1F2" stroke="#E11D48" stroke-width="3"/>
    <rect x="80" y="273" width="54" height="42" rx="21" fill="#E11D48"/><text x="107" y="301" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">A</text>
    <text x="152" y="309" font-size="28" font-weight="800" fill="#9F1239">Sem assinatura/registro</text>
    <text x="88" y="359" text-anchor="start" font-size="21" font-weight="500" fill="#334155"><tspan x="88" dy="0">• Recusar a execução</tspan><tspan x="88" dy="31">• Exceção: urgência/emergência</tspan></text>
  </g><path d="M 401 490 C 412 490, 412 490, 423 490" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><g>
    <rect x="430" y="255" width="338" height="470" rx="24" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
    <rect x="452" y="273" width="54" height="42" rx="21" fill="#D97706"/><text x="479" y="301" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">B</text>
    <text x="524" y="309" font-size="28" font-weight="800" fill="#92400E">Erro ou ilegível</text>
    <text x="460" y="359" text-anchor="start" font-size="21" font-weight="500" fill="#334155"><tspan x="460" dy="0">• Esclarecer com o prescritor</tspan><tspan x="460" dy="31">• Registrar no prontuário</tspan></text>
  </g><path d="M 773 490 C 784 490, 784 490, 795 490" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><g>
    <rect x="802" y="255" width="338" height="470" rx="24" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
    <rect x="824" y="273" width="54" height="42" rx="21" fill="#16A34A"/><text x="851" y="301" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">C</text>
    <text x="896" y="309" font-size="28" font-weight="800" fill="#166534">Regular</text>
    <text x="832" y="359" text-anchor="start" font-size="21" font-weight="500" fill="#334155"><tspan x="832" dy="0">• Seguir normas</tspan><tspan x="832" dy="31">• Realizar checagens de segurança</tspan></text>
  </g></g>
  <rect x="70" y="816" width="1060" height="56" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><text x="600" y="851" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#475569">Material de revisão legal; não substitui normas institucionais.</text>
  <text x="1130" y="886" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94A3B8">ETH-COD-002</text>
</svg>
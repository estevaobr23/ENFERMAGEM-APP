<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Quem faz o quê?</title>
  <desc id="desc">Lei 7.498/1986 + Decreto 94.406/1987. Técnico de Enfermagem: Participa da programação, Executa ações, exceto privativas, Assiste o enfermeiro, Sob orientação e supervisão. Privativo do Enfermeiro: Consulta de enfermagem, Prescrição da assistência, Cuidados diretos a graves, Maior complexidade técnica</desc>

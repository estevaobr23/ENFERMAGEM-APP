    <text x="185" y="298" font-size="28" font-weight="800" fill="#115E59">Técnico de Enfermagem</text>
    <text x="106" y="348" text-anchor="start" font-size="21" font-weight="500" fill="#334155"><tspan x="106" dy="0">• Participa da programação</tspan><tspan x="106" dy="31">• Executa ações, exceto privativas</tspan><tspan x="106" dy="31">• Assiste o enfermeiro</tspan><tspan x="106" dy="31">• Sob orientação e supervisão</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Gotejamento</title>
  <desc id="desc">1 mL = 20 gotas = 60 microgotas. Gotas (macrogotas): gotas/min = V ÷ (T × 3), V em mL, T em horas. Microgotas: microgotas/min = V ÷ T, V em mL, T em horas</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <rect x="54" y="54" width="8" height="116" rx="4" fill="#EA580C"/>
  <text x="88" y="100" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="850" fill="#0F172A">Gotejamento</text>
  <text x="88" y="142" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#475569">1 mL = 20 gotas = 60 microgotas</text>
  <g font-family="Inter, Arial, sans-serif"><g>
    <rect x="76" y="244" width="490" height="490" rx="24" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>
    <rect x="98" y="262" width="54" height="42" rx="21" fill="#EA580C"/><text x="125" y="290" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">20</text>
    <text x="170" y="298" font-size="28" font-weight="800" fill="#9A3412">Gotas (macrogotas)</text>
    <text x="106" y="348" text-anchor="start" font-size="21" font-weight="500" fill="#334155"><tspan x="106" dy="0">• gotas/min = V ÷ (T × 3)</tspan><tspan x="106" dy="31">• V em mL</tspan><tspan x="106" dy="31">• T em horas</tspan></text>
  </g><g>
    <rect x="634" y="244" width="490" height="490" rx="24" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
    <rect x="656" y="262" width="54" height="42" rx="21" fill="#2563EB"/><text x="683" y="290" text-anchor="middle" font-size="20" font-weight="800" fill="#FFFFFF">60</text>
    <text x="728" y="298" font-size="28" font-weight="800" fill="#1E3A8A">Microgotas</text>
    <text x="664" y="348" text-anchor="start" font-size="21" font-weight="500" fill="#334155"><tspan x="664" dy="0">• microgotas/min = V ÷ T</tspan><tspan x="664" dy="31">• V em mL</tspan><tspan x="664" dy="31">• T em horas</tspan></text>
  </g><circle cx="600" cy="488" r="34" fill="#FFFFFF" stroke="#EA580C" stroke-width="3"/><text x="600" y="499" text-anchor="middle" font-size="28" font-weight="900" fill="#9A3412">×</text></g>
  <rect x="70" y="816" width="1060" height="56" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><text x="600" y="851" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#475569">Exercício educacional — não programar infusão real.</text>
  <text x="1130" y="886" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94A3B8">CAL-GOT-001</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Gotejamento — exercício</title>
  <desc id="desc">500 mL em 8 horas. 1 · Dados: V = 500 mL · T = 8 h. 2 · Fórmula: gotas/min = V ÷ (T × 3). 3 · Substituir: 500 ÷ (8 × 3). 4 · Calcular: 500 ÷ 24 = 20,83. 5 · Arredondar: 21 gotas/min</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <rect x="54" y="54" width="8" height="116" rx="4" fill="#EA580C"/>
  <text x="88" y="100" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="850" fill="#0F172A">Gotejamento — exercício</text>
  <text x="88" y="142" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#475569">500 mL em 8 horas</text>
  <g font-family="Inter, Arial, sans-serif"><g>
    <rect x="154" y="220" width="892" height="100" rx="24" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>
    
    <text x="180" y="267" font-size="24" font-weight="800" fill="#9A3412">1 · Dados</text>
    <text x="184" y="306" text-anchor="start" font-size="18" font-weight="500" fill="#334155"><tspan x="184" dy="0">• V = 500 mL · T = 8 h</tspan></text>
  </g><path d="M 600 322 C 600 322, 600 335, 600 335" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#arrow)"/><g>
    <rect x="154" y="338" width="892" height="100" rx="24" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
    
    <text x="180" y="385" font-size="24" font-weight="800" fill="#1E3A8A">2 · Fórmula</text>
    <text x="184" y="424" text-anchor="start" font-size="18" font-weight="500" fill="#334155"><tspan x="184" dy="0">• gotas/min = V ÷ (T × 3)</tspan></text>
  </g><path d="M 600 440 C 600 440, 600 453, 600 453" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#arrow)"/><g>
    <rect x="154" y="456" width="892" height="100" rx="24" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3"/>
    
    <text x="180" y="503" font-size="24" font-weight="800" fill="#5B21B6">3 · Substituir</text>
    <text x="184" y="542" text-anchor="start" font-size="18" font-weight="500" fill="#334155"><tspan x="184" dy="0">• 500 ÷ (8 × 3)</tspan></text>
  </g><path d="M 600 558 C 600 558, 600 571, 600 571" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#arrow)"/><g>
    <rect x="154" y="574" width="892" height="100" rx="24" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
    
    <text x="180" y="621" font-size="24" font-weight="800" fill="#92400E">4 · Calcular</text>
    <text x="184" y="660" text-anchor="start" font-size="18" font-weight="500" fill="#334155"><tspan x="184" dy="0">• 500 ÷ 24 = 20,83</tspan></text>
  </g><path d="M 600 676 C 600 676, 600 689, 600 689" fill="none" stroke="#EA580C" stroke-width="4" marker-end="url(#arrow)"/><g>
    <rect x="154" y="692" width="892" height="100" rx="24" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
    
    <text x="180" y="739" font-size="24" font-weight="800" fill="#166534">5 · Arredondar</text>
    <text x="184" y="778" text-anchor="start" font-size="18" font-weight="500" fill="#334155"><tspan x="184" dy="0">• 21 gotas/min</tspan></text>
  </g></g>
  <rect x="70" y="816" width="1060" height="56" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/><text x="600" y="851" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#475569">Exercício educacional — siga prescrição e protocolo institucional na prática.</text>
  <text x="1130" y="886" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94A3B8">CAL-GOT-002</text>
</svg>
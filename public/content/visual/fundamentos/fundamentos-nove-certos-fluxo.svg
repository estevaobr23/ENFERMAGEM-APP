  <title id="title">Os 9 certos</title>
  <desc id="desc">Antes, durante e depois de administrar. Quem e o quê: 1 · Paciente certo, 2 · Medicamento certo, 8 · Forma certa. Como e quando: 3 · Via certa, 4 · Hora certa, 5 · Dose certa. Depois: 6 · Registro certo, 7 · Orientação correta, 9 · Resposta certa</desc>

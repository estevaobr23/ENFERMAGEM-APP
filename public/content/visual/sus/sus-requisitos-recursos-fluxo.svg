<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Recebimento de recursos</title>
  <desc id="desc">Requisitos do art. 4º da Lei 8.142. Fundo de Saúde: Estrutura financeira. Conselho de Saúde: Composição paritária. Plano de Saúde: Planejamento formal. Relatório de Gestão: Prestação de contas. Contrapartida: Recursos no orçamento. Comissão de PCCS: Plano de carreira, cargos, e salários</desc>
